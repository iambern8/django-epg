name: Update EPG Strong8k

on:
  schedule:
    # Taeglich um 03:00 UTC (= 04:00 Wien)
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Manueller Trigger fuer Tests

jobs:
  update-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install requests

      - name: Fetch EPG Data
        env:
          XTREAM_HOST: ${{ secrets.XTREAM_HOST }}
          XTREAM_USER: ${{ secrets.XTREAM_USER }}
          XTREAM_PASS: ${{ secrets.XTREAM_PASS }}
        run: python epg_fetcher_strong8k.py

      - name: Commit and Push EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add epg_strong8k.xml
          # Nur committen wenn sich etwas geaendert hat
          git diff --cached --quiet || git commit -m "EPG Update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
